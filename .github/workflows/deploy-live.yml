name: Deploy to LIVE Production (Requires Manual Approval)

on:
  # Manual dispatch trigger only - production deployments must be initiated manually
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type "DEPLOY_LIVE" to confirm production deployment'
        required: true
        default: ''

jobs:
  deploy-live:
    name: Deploy Worker to LIVE Production
    runs-on: ubuntu-latest
    # The 'production' environment in GitHub Actions enforces protection rules
    # and required manual reviewers prior to deployment execution
    environment:
      name: production
      url: https://telegram-ai-agent-live.workers.dev
    steps:
      - name: Validate Confirmation
        if: github.event.inputs.confirmation != 'DEPLOY_LIVE'
        run: |
          echo "Deployment aborted: Confirmation string 'DEPLOY_LIVE' was not provided."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Check
        run: npm run typecheck

      - name: Run Test Suite
        run: npm test

      - name: Deploy to Cloudflare Workers (LIVE)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env live
